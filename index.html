
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Impostor App</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Fontes dos temas de teste (Editorial, Bubblegum) -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Aplica o tema salvo antes do paint (evita flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('app_theme');
          if (!t || ['classic','editorial','bubblegum'].indexOf(t) === -1) t = 'classic';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'classic' && localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      .select-none, .select-none * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
      }
      .scrollbar-custom::-webkit-scrollbar {
        width: 8px;
      }
      .scrollbar-custom::-webkit-scrollbar-track {
        background: #f3f4f6;
        border-radius: 10px;
      }
      .dark .scrollbar-custom::-webkit-scrollbar-track {
        background: #1f2937;
      }
      .scrollbar-custom::-webkit-scrollbar-thumb {
        background: var(--accent, #5352ed);
        border-radius: 10px;
      }
      .scrollbar-custom::-webkit-scrollbar-thumb:hover {
        opacity: 0.85;
      }
      .scrollbar-custom {
        scrollbar-width: thin;
        scrollbar-color: var(--accent, #5352ed) #f3f4f6;
      }
      .dark .scrollbar-custom {
        scrollbar-color: var(--accent, #6366f1) #1f2937;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<link rel="stylesheet" href="/themes.css">
</head>
  <body class="gradient-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
